    <circle cx="208" cy="150" r="23" fill="#58a6ff" stroke="#0d1117" stroke-width="4"/>
    <circle cx="256" cy="108" r="26" fill="#a371f7" stroke="#0d1117" stroke-width="4"/>
    <circle cx="256" cy="108" r="36" fill="none" stroke="#a371f7" stroke-width="3" opacity="0.55"/>
    <circle cx="308" cy="164" r="23" fill="#d29922" stroke="#0d1117" stroke-width="4"/>

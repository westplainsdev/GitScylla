    <circle cx="121" cy="173" r="4.5" fill="#0d1117"/>
    <circle cx="135" cy="173" r="4.5" fill="#0d1117"/>
    <circle cx="201" cy="145" r="4.5" fill="#0d1117"/>
    <circle cx="215" cy="145" r="4.5" fill="#0d1117"/>
    <circle cx="248" cy="102" r="5" fill="#0d1117"/>
    <circle cx="264" cy="102" r="5" fill="#0d1117"/>
    <circle cx="301" cy="159" r="4.5" fill="#0d1117"/>
    <circle cx="315" cy="159" r="4.5" fill="#0d1117"/>
    <circle cx="381" cy="199" r="4.5" fill="#0d1117"/>
    <circle cx="395" cy="199" r="4.5" fill="#0d1117"/>
